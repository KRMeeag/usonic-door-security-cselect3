; PlatformIO Project Configuration File
;
; Door Intrusion Detection — CS Elect 2 IoT midterm (Group 2, Smart Home)
; ESP32-S3 + Blynk door intrusion alarm with a user-armed window.
;
; Two build environments share one source tree via build_src_filter:
;   esp32-s3-devkitc-1 : the real firmware        (src/main.cpp)
;   hwcheck            : hardware bring-up test   (src/hw_check.cpp)
;
; Build/flash one at a time, e.g.
;   pio run -e hwcheck -t upload && pio device monitor -e hwcheck
;   pio run -e esp32-s3-devkitc-1 -t upload && pio device monitor
;
; Plug into the port silk-screened "UART" (the CP210x bridge). Serial is UART0;
; the native-USB port is not used.

[platformio]
; Bare `pio run` / `pio run -t upload` targets only the firmware.
; The bring-up test is opt-in: `pio run -e hwcheck ...`
default_envs = esp32-s3-devkitc-1

[env]
; Pinned on purpose: the LEDC / tone() toolchain changed between Arduino-ESP32
; core 2.x and 3.x. 7.0.1 ships core 2.0.17 and is what this machine already has
; cached — a floating platform that breaks pre-demo is not worth the risk.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Serial -> UART0 -> the "UART" USB-C connector (this is also the board default).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Exact versions, again to keep demo day reproducible. Blynk is only #included by
; main.cpp, so the hwcheck build simply never compiles it.
lib_deps =
    blynkkk/Blynk@1.3.5
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<hw_check.cpp>

[env:hwcheck]
build_src_filter = +<*> -<main.cpp>
