; PlatformIO Project Configuration File
;
; Door Intrusion Detection — CS Elect 2 IoT midterm (Group 2, Smart Home)
; ESP32-S3 + Blynk door intrusion alarm with a user-armed window.
;
; One environment, one binary. Build/upload with the PlatformIO → button or:
;   pio run -t upload && pio device monitor
;
; Hardware bring-up checks live in the firmware itself now — send 'h' over the
; serial monitor for the command list (p = ping burst, t = LED/piezo self-test).
;
; Plug into the USB-C port silk-screened "UART" (the CP210x bridge). Serial is
; UART0; the native-USB port is not used.

[env:esp32-s3-devkitc-1]
; Pinned on purpose: the LEDC / tone() toolchain changed between Arduino-ESP32
; core 2.x and 3.x. 7.0.1 ships core 2.0.17 and is what this machine already has
; cached — a floating platform that breaks pre-demo is not worth the risk.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Serial -> UART0 -> the "UART" USB-C connector (also the board default).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Exact versions to keep demo day reproducible.
lib_deps =
    blynkkk/Blynk@1.3.5
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
